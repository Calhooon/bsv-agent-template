[package]
name = "bsv-agent-template"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# BSV crates (from crates.io)
bsv-middleware-cloudflare = { version = "0.5.1", features = ["refund", "d1-claims"] }
bsv-sdk = { package = "bsv-rs", version = "0.4", features = ["auth", "wallet", "transaction", "wasm"] }

# Other crates (from crates.io)
worker = { version = "0.8", features = ["d1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
