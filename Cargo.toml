[package]
name = "bsv-agent-template"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# BSV crates (from crates.io)
bsv-middleware-cloudflare = { path = "../wt-middleware-lane/.claude/worktrees/mw-port", features = ["refund", "d1-claims"] }  # TEMP until 0.3.6 publishes (M5 #36)
bsv-sdk = { package = "bsv-rs", version = "0.3", features = ["auth", "wallet", "transaction", "wasm"] }

# Other crates (from crates.io)
worker = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
