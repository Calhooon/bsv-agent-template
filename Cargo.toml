[package]
name = "bsv-agent-template"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Calhooon/bsv-agent-template"

[lib]
crate-type = ["cdylib"]

[dependencies]
# BSV crates (from crates.io)
bsv-middleware-cloudflare = { version = "0.6.2", features = ["refund", "d1-claims"] }
bsv-sdk = { package = "bsv-rs", version = "0.6.0", features = ["auth", "wallet", "transaction", "wasm"] }

bsv-worker-build-info = "=0.1.0"

# Other crates (from crates.io)
worker = { version = "0.8", features = ["d1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[build-dependencies]
bsv-worker-build-info = { version = "=0.1.0", features = ["build"] }
